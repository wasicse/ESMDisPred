[project]
name = "dispredict3"
version = "0.1.0"
description = "Dispredict3.0: Prediction of Intrinsically Disordered Proteins with Protein Language Model"
authors = [{name = "Md Wasi Ul Kabir", email = "mkabir3@uno.edu"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=0.23.1",
    "keras>=2.4.3",
    "tensorflow>=2.4.1",
    "pandas>=1.2.2",
    "fair-esm>=0.4.0",
    "lightgbm>=3.3.2",
    "biopython>=1.79",
    "gdown>=4.4.0",
    "torch==2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
